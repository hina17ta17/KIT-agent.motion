<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">
<title>kit-agent モーションスタジオ</title>
<style>
:root{
  --t:1;                     /* 速度係数（小さいほど速い） */
  --ink:#2f4f72;
  --line:#3c6e9f;
  --card:rgba(255,255,255,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:16px 14px 30px;
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  color:var(--ink);
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  background:
    radial-gradient(1100px 680px at 10% 6%,#ffdad4 0%,transparent 58%),
    radial-gradient(900px 620px at 92% 14%,#cbe8fb 0%,transparent 58%),
    radial-gradient(900px 700px at 74% 98%,#d3f4e6 0%,transparent 58%),
    linear-gradient(158deg,#f7e3ea 0%,#e5e3f6 40%,#d8edf9 70%,#dcf5ed 100%);
  background-attachment:fixed;
}

/* ============ ヘッダー ============ */
.head{
  width:min(1040px,100%);display:flex;align-items:center;gap:14px;
  padding:10px 16px;border-radius:20px;
  background:var(--card);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 10px 30px rgba(84,120,170,.13);backdrop-filter:blur(8px);
}
.head img{width:52px;height:52px;object-fit:cover;border-radius:14px;border:2px solid #fff;
  box-shadow:0 4px 12px rgba(84,120,170,.25);flex:0 0 auto}
.head h1{margin:0;font-size:19px;letter-spacing:.02em}
.head p{margin:2px 0 0;font-size:12.5px;opacity:.72}
.badge{margin-left:auto;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;
  background:linear-gradient(135deg,#8fd4a8,#7ec8ea);color:#1d4b63;white-space:nowrap;
  box-shadow:0 4px 12px rgba(100,180,200,.3)}

/* ============ ステージ ============ */
.stage{
  position:relative;width:min(1040px,100%);
  height:clamp(400px,62vh,560px);
  border-radius:28px;overflow:hidden;
  border:1px solid rgba(255,255,255,.8);
  background:linear-gradient(160deg,#fbe0e2 0%,#e8e4f7 38%,#d8eefb 68%,#dbf6ee 100%);
  box-shadow:0 18px 44px rgba(84,120,170,.18),inset 0 2px 0 rgba(255,255,255,.6);
  display:flex;align-items:flex-end;justify-content:center;
  perspective:1100px;
  touch-action:manipulation;
}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;pointer-events:none}
.b1{width:260px;height:260px;left:-60px;top:-50px;background:#ffc9c2;animation:float1 calc(14s*var(--t)) ease-in-out infinite}
.b2{width:230px;height:230px;right:-40px;top:20px;background:#b9dcff;animation:float2 calc(17s*var(--t)) ease-in-out infinite}
.b3{width:200px;height:200px;right:18%;bottom:-70px;background:#b7f0d8;animation:float1 calc(20s*var(--t)) ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,26px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.08)}}

.ground{
  position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;
  background:
    linear-gradient(to top,rgba(120,160,200,.16),transparent),
    repeating-linear-gradient(90deg,rgba(90,140,190,.16) 0 3px,transparent 3px 46px);
  mask-image:linear-gradient(to top,#000 20%,transparent 100%);
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 100%);
}
@keyframes groundRun{from{background-position:0 0,0 0}to{background-position:0 0,-46px 0}}

.botwrap{
  position:relative;height:78%;margin-bottom:5%;
  transform-style:preserve-3d;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#bot{height:100%;width:auto;overflow:visible;display:block}

.tag{
  position:absolute;left:18px;top:16px;font-size:13px;font-weight:700;
  padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(84,120,170,.16);
  letter-spacing:.04em;
}
.tag small{display:block;font-weight:500;font-size:10.5px;opacity:.6;letter-spacing:0}
.tip{position:absolute;right:18px;bottom:14px;font-size:11.5px;opacity:.55}

/* ============ 操作パネル ============ */
.panel{
  width:min(1040px,100%);padding:14px 16px 16px;border-radius:24px;
  background:var(--card);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 10px 30px rgba(84,120,170,.13);backdrop-filter:blur(8px);
}
.btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  flex:1 1 104px;min-width:96px;max-width:168px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 6px 9px;border-radius:16px;cursor:pointer;
  border:1.5px solid rgba(120,165,210,.3);
  background:linear-gradient(180deg,#ffffff,#eef6fd);
  color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:700;
  box-shadow:0 3px 0 rgba(120,165,210,.28);
  transition:transform .12s,box-shadow .12s,background .2s;
}
.btn i{font-style:normal;font-size:21px;line-height:1}
.btn kbd{font-size:9.5px;opacity:.45;font-family:inherit;font-weight:600}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(120,165,210,.3)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(120,165,210,.3)}
.btn.on{
  background:linear-gradient(180deg,#7fd3ef,#5cb8e8);color:#0f3d55;
  border-color:#4aa8dc;box-shadow:0 3px 0 #3d92c2;
}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:13px;
  padding-top:12px;border-top:1px dashed rgba(120,165,210,.35);font-size:12.5px}
.opts label{display:flex;align-items:center;gap:8px;font-weight:600}
input[type=range]{width:150px;accent-color:#5cb8e8}
.sw{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;
  padding:6px 13px;border-radius:999px;border:1.5px solid rgba(120,165,210,.3);
  background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,#8fe0b4,#68cfe8);border-color:#5cc0d8;color:#0f4a55}
.note{margin:11px 0 0;font-size:11.5px;opacity:.6;line-height:1.7}

@media (max-width:560px){
  .head h1{font-size:16px}.head p{display:none}
  .btn{flex:1 1 76px;min-width:72px;font-size:11px}
  .btn i{font-size:18px}
  .stage{height:46vh;min-height:330px}
}

/* ===== リグ（関節）: transform-box:view-box で viewBox 座標を原点に使う ===== */
#drift,#lean,#bob,#torso,#headTilt,#head,#face,#armL,#armR,#foreL,#foreR,
#legL,#legR,#shinL,#shinR,#footL,#footR,#antL,#antR,#shadow{transform-box:view-box}
#bob    {transform-origin:180px 607px}
#lean   {transform-origin:180px 610px}
#torso  {transform-origin:180px 460px}
#headTilt,#head{transform-origin:180px 249px}
#face   {transform-origin:180px 150px}
#armL   {transform-origin:80px 287px}
#armR   {transform-origin:280px 287px}
#foreL  {transform-origin:77px 363px}
#foreR  {transform-origin:283px 363px}
#legL   {transform-origin:123px 449px}
#legR   {transform-origin:237px 449px}
#shinL  {transform-origin:123px 497px}
#shinR  {transform-origin:237px 497px}
#footL  {transform-origin:123px 561px}
#footR  {transform-origin:237px 561px}
#antL   {transform-origin:75px 115px}
#antR   {transform-origin:285px 115px}
#shadow {transform-origin:180px 614px}
#headTilt,#face{transition:transform .28s cubic-bezier(.22,1,.36,1)}

/* ===== 表情の出し分け ===== */
#faceHappy,#faceBlink,#faceWide,#faceSurprise,#faceSleepy,#faceHeart,#faceThink,#faceDizzy{display:none}
.stage[data-face="happy"]    #faceHappy{display:block}
.stage[data-face="blink"]    #faceBlink{display:block}
.stage[data-face="wide"]     #faceWide{display:block}
.stage[data-face="surprise"] #faceSurprise{display:block}
.stage[data-face="sleepy"]   #faceSleepy{display:block}
.stage[data-face="heart"]    #faceHeart{display:block}
.stage[data-face="think"]    #faceThink{display:block}
.stage[data-face="dizzy"]    #faceDizzy{display:block}

/* ===== エフェクトの出し分け ===== */
#fxZzz,#fxBubble,#fxExcl,#fxSparkle,#fxNote{display:none}
[data-act="sleep"]    #fxZzz,
[data-act="think"]    #fxBubble,
[data-act="surprise"] #fxExcl,
[data-act="cheer"]    #fxSparkle,
[data-act="dance"]    #fxSparkle,
[data-act="dance"]    #fxNote,
[data-act="spin"]     #fxSparkle{display:block}

/* ===== 待機モーション（基本） ===== */
#bob  {animation:bob      calc(2.8s*var(--t)) ease-in-out infinite}
#torso{animation:breathe  calc(2.8s*var(--t)) ease-in-out infinite}
#head {animation:headSway calc(5.2s*var(--t)) ease-in-out infinite}
#armL {animation:idleArmL calc(3.4s*var(--t)) ease-in-out infinite}
#armR {animation:idleArmR calc(3.7s*var(--t)) ease-in-out infinite}
#foreL{animation:idleForeL calc(3.4s*var(--t)) ease-in-out infinite}
#foreR{animation:idleForeR calc(3.7s*var(--t)) ease-in-out infinite}
#antL {animation:antL     calc(2.4s*var(--t)) ease-in-out infinite}
#antR {animation:antR     calc(2.7s*var(--t)) ease-in-out infinite}
#shadow{animation:shPulse calc(2.8s*var(--t)) ease-in-out infinite}
#glow {animation:glow     calc(2.8s*var(--t)) ease-in-out infinite}
#scanline{animation:scan  calc(4.2s*var(--t)) linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.982)}}
@keyframes headSway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes idleArmL{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4.5deg)}}
@keyframes idleArmR{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-4.5deg)}}
@keyframes idleForeL{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(3deg)}}
@keyframes idleForeR{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-3deg)}}
@keyframes antL{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
@keyframes antR{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-6deg)}}
@keyframes shPulse{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(.9);opacity:.14}}
@keyframes glow{0%,100%{opacity:.13}50%{opacity:.3}}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.35}90%{opacity:.35}100%{transform:translateY(132px);opacity:0}}

/* ===== 1. 手をふる ===== */
[data-act="wave"] #armR {animation:waveRaise calc(.55s*var(--t)) cubic-bezier(.34,1.5,.5,1) forwards}
[data-act="wave"] #foreR{animation:waveHand calc(.46s*var(--t)) ease-in-out calc(.42s*var(--t)) infinite alternate}
[data-act="wave"] #bob  {animation:bob calc(1.1s*var(--t)) ease-in-out infinite}
[data-act="wave"] #head {animation:waveHead calc(1.1s*var(--t)) ease-in-out infinite}
[data-act="wave"] #antR {animation:antR calc(.52s*var(--t)) ease-in-out infinite}
[data-act="wave"] #antL {animation:antL calc(.62s*var(--t)) ease-in-out infinite}
[data-act="wave"] #armL {animation:idleArmL calc(1.1s*var(--t)) ease-in-out infinite}
@keyframes waveRaise{from{transform:rotate(0)}to{transform:rotate(-132deg)}}
@keyframes waveHand{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes waveHead{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-1deg)}}

/* ===== 2. 歩く（足踏み＋地面スクロール） ===== */
[data-act="walk"] .ground{animation:groundRun calc(.62s*var(--t)) linear infinite}
[data-act="walk"] #bob  {animation:walkBob calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #lean {animation:walkLean calc(1.44s*var(--t)) ease-in-out infinite}
[data-act="walk"] #legL {animation:marchL calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #legR {animation:marchR calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #shinL{animation:kneeL calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #shinR{animation:kneeR calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #footL{animation:ankleL calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #footR{animation:ankleR calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #armL {animation:swingL calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #armR {animation:swingR calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #foreL{animation:idleForeL calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #foreR{animation:idleForeR calc(.72s*var(--t)) ease-in-out infinite}
[data-act="walk"] #head {animation:walkHead calc(1.44s*var(--t)) ease-in-out infinite}
[data-act="walk"] #shadow{animation:walkSh calc(.72s*var(--t)) ease-in-out infinite}
@keyframes walkBob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-10px)}}
@keyframes walkLean{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes marchL{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-26px) rotate(5deg)}38%{transform:translateY(0) rotate(0)}}
@keyframes marchR{0%,50%,100%{transform:translateY(0) rotate(0)}68%{transform:translateY(-26px) rotate(-5deg)}88%{transform:translateY(0) rotate(0)}}
@keyframes kneeL{0%,100%{transform:rotate(0)}18%{transform:rotate(-40deg)}38%{transform:rotate(0)}}
@keyframes kneeR{0%,50%,100%{transform:rotate(0)}68%{transform:rotate(40deg)}88%{transform:rotate(0)}}
@keyframes ankleL{0%,100%{transform:rotate(0)}18%{transform:rotate(16deg)}38%{transform:rotate(0)}}
@keyframes ankleR{0%,50%,100%{transform:rotate(0)}68%{transform:rotate(-16deg)}88%{transform:rotate(0)}}
@keyframes swingL{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
@keyframes swingR{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
@keyframes walkHead{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes walkSh{0%,50%,100%{transform:scale(1);opacity:.2}25%,75%{transform:scale(.88);opacity:.13}}

/* ===== 3. ジャンプ ===== */
[data-act="jump"] #bob   {animation:jumpBody calc(1.7s*var(--t)) cubic-bezier(.4,0,.5,1) infinite}
[data-act="jump"] #shadow{animation:jumpSh calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #legL  {animation:jumpLegL calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #legR  {animation:jumpLegR calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #shinL {animation:jumpKneeL calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #shinR {animation:jumpKneeR calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #armL  {animation:jumpArmL calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #armR  {animation:jumpArmR calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #head  {animation:jumpHead calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #antL  {animation:jumpAntL calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="jump"] #antR  {animation:jumpAntR calc(1.7s*var(--t)) ease-in-out infinite}
@keyframes jumpBody{
  0%,6%{transform:translateY(0) scale(1,1)}
  16%{transform:translateY(16px) scale(1.12,.86)}
  22%{transform:translateY(6px) scale(1.04,.96)}
  34%{transform:translateY(-92px) scale(.92,1.12)}
  44%{transform:translateY(-108px) scale(1,1)}
  56%{transform:translateY(-52px) scale(.95,1.06)}
  66%{transform:translateY(10px) scale(1.16,.84)}
  76%{transform:translateY(0) scale(.97,1.03)}
  86%,100%{transform:translateY(0) scale(1,1)}}
@keyframes jumpSh{
  0%,10%{transform:scale(1);opacity:.2}
  16%{transform:scale(1.12);opacity:.24}
  44%{transform:scale(.5);opacity:.07}
  66%{transform:scale(1.12);opacity:.24}
  86%,100%{transform:scale(1);opacity:.2}}
@keyframes jumpLegL{0%,16%{transform:rotate(0)}44%{transform:rotate(10deg)}66%,100%{transform:rotate(0)}}
@keyframes jumpLegR{0%,16%{transform:rotate(0)}44%{transform:rotate(-10deg)}66%,100%{transform:rotate(0)}}
@keyframes jumpKneeL{0%,16%{transform:rotate(0)}40%{transform:rotate(-46deg)}66%,100%{transform:rotate(0)}}
@keyframes jumpKneeR{0%,16%{transform:rotate(0)}40%{transform:rotate(46deg)}66%,100%{transform:rotate(0)}}
@keyframes jumpArmL{0%{transform:rotate(0)}16%{transform:rotate(-26deg)}40%{transform:rotate(148deg)}66%{transform:rotate(30deg)}86%,100%{transform:rotate(0)}}
@keyframes jumpArmR{0%{transform:rotate(0)}16%{transform:rotate(26deg)}40%{transform:rotate(-148deg)}66%{transform:rotate(-30deg)}86%,100%{transform:rotate(0)}}
@keyframes jumpHead{0%,16%{transform:translateY(0)}34%{transform:translateY(7px)}66%{transform:translateY(-5px)}86%,100%{transform:translateY(0)}}
@keyframes jumpAntL{0%,16%{transform:rotate(0)}34%{transform:rotate(28deg)}56%{transform:rotate(-18deg)}80%,100%{transform:rotate(0)}}
@keyframes jumpAntR{0%,16%{transform:rotate(0)}34%{transform:rotate(-28deg)}56%{transform:rotate(18deg)}80%,100%{transform:rotate(0)}}

/* ===== 4. ダンス ===== */
[data-act="dance"] #bob  {animation:dBob calc(.54s*var(--t)) ease-in-out infinite}
[data-act="dance"] #lean {animation:dLean calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #torso{animation:dTorso calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #armL {animation:dArmL calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #armR {animation:dArmR calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #foreL{animation:dForeL calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #foreR{animation:dForeR calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #legL {animation:dLegL calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #legR {animation:dLegR calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #shinL{animation:dKneeL calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #shinR{animation:dKneeR calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #head {animation:dHead calc(1.08s*var(--t)) ease-in-out infinite}
[data-act="dance"] #antL {animation:antL calc(.54s*var(--t)) ease-in-out infinite}
[data-act="dance"] #antR {animation:antR calc(.54s*var(--t)) ease-in-out infinite}
[data-act="dance"] #shadow{animation:shPulse calc(.54s*var(--t)) ease-in-out infinite}
[data-act="dance"] .stage-inner{animation:hue calc(6s*var(--t)) linear infinite}
@keyframes dBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes dLean{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes dTorso{0%,100%{transform:rotate(3deg) scale(1)}50%{transform:rotate(-3deg) scale(1.02,.99)}}
@keyframes dArmL{0%,100%{transform:rotate(128deg)}50%{transform:rotate(22deg)}}
@keyframes dArmR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(-128deg)}}
@keyframes dForeL{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(18deg)}}
@keyframes dForeR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(34deg)}}
@keyframes dLegL{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(9deg)}}
@keyframes dLegR{0%,100%{transform:translateY(-8px) rotate(-9deg)}50%{transform:translateY(0) rotate(0)}}
@keyframes dKneeL{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes dKneeR{0%,100%{transform:rotate(26deg)}50%{transform:rotate(0)}}
@keyframes dHead{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
@keyframes hue{0%,100%{filter:hue-rotate(0deg) saturate(1)}50%{filter:hue-rotate(28deg) saturate(1.22)}}

/* ===== 5. ロボットダンス（カクカク / steps） ===== */
[data-act="robot"] #bob  {animation:rBob calc(1.6s*var(--t)) steps(1,end) infinite}
[data-act="robot"] #lean {animation:rLean calc(1.6s*var(--t)) steps(1,end) infinite}
[data-act="robot"] #head {animation:rHead calc(1.6s*var(--t)) steps(1,end) infinite}
[data-act="robot"] #armL {animation:rArmL calc(1.6s*var(--t)) steps(1,end) infinite}

@keyframes rHead{0%{transform:rotate(-11deg)}25%{transform:rotate(0)}50%{transform:rotate(11deg)}62%{transform:rotate(0)}75%{transform:rotate(-7deg)}87%{transform:rotate(7deg)}}
@keyframes rArmL{0%{transform:rotate(90deg)}25%{transform:rotate(20deg)}50%{transform:rotate(140deg)}75%{transform:rotate(60deg)}}
@keyframes rArmR{0%{transform:rotate(-20deg)}25%{transform:rotate(-140deg)}50%{transform:rotate(-60deg)}75%{transform:rotate(-90deg)}}
@keyframes rForeL{0%{transform:rotate(-80deg)}25%{transform:rotate(0)}50%{transform:rotate(-60deg)}75%{transform:rotate(-100deg)}}
@keyframes rForeR{0%{transform:rotate(0)}25%{transform:rotate(80deg)}50%{transform:rotate(100deg)}75%{transform:rotate(40deg)}}

@keyframes rLegR{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(0) rotate(0)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-18px) rotate(-8deg)}}
@keyframes rAntL{0%{transform:rotate(-16deg)}25%{transform:rotate(10deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(16deg)}}
@keyframes rAntR{0%{transform:rotate(16deg)}25%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-16deg)}}
@keyframes blink2{0%{opacity:.34}50%{opacity:.07}}

/* ===== 6. 回転（3D） ===== */
[data-act="spin"] .botwrap{animation:spin3d calc(1.9s*var(--t)) linear infinite}
[data-act="spin"] #bob  {animation:spinHop calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #armL {animation:spinArmL calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #armR {animation:spinArmR calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #legL {animation:spinLegL calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #legR {animation:spinLegR calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #head {animation:headSway calc(.95s*var(--t)) ease-in-out infinite}
[data-act="spin"] #shadow{animation:jumpSh calc(.95s*var(--t)) ease-in-out infinite}
@keyframes spin3d{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes spinHop{0%,100%{transform:translateY(0) scale(1.04,.94)}45%{transform:translateY(-34px) scale(.97,1.05)}}
@keyframes spinArmL{0%,100%{transform:rotate(40deg)}50%{transform:rotate(96deg)}}
@keyframes spinArmR{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(-96deg)}}
@keyframes spinLegL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) translateY(-8px)}}
@keyframes spinLegR{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg) translateY(-8px)}}

/* ===== 7. 考える ===== */
[data-act="think"] #armR {animation:thArmR calc(.8s*var(--t)) cubic-bezier(.34,1.4,.5,1) forwards}
[data-act="think"] #foreR{animation:thForeR calc(.8s*var(--t)) cubic-bezier(.34,1.4,.5,1) forwards}
[data-act="think"] #head {animation:thHead calc(3.4s*var(--t)) ease-in-out infinite}
[data-act="think"] #bob  {animation:bob calc(4s*var(--t)) ease-in-out infinite}
[data-act="think"] #antL {animation:thAnt calc(1.7s*var(--t)) ease-in-out infinite}
[data-act="think"] #antR {animation:thAnt calc(1.7s*var(--t)) ease-in-out .3s infinite}
[data-act="think"] #armL {animation:idleArmL calc(4s*var(--t)) ease-in-out infinite}
@keyframes thArmR{from{transform:rotate(0)}to{transform:rotate(-7deg)}}
@keyframes thForeR{from{transform:rotate(0)}to{transform:rotate(167deg)}}
@keyframes thHead{0%,100%{transform:rotate(-10deg)}45%{transform:rotate(-13deg) translateY(2px)}70%{transform:rotate(-7deg)}}
@keyframes thAnt{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}

/* ===== 8. びっくり ===== */
[data-act="surprise"] #bob  {animation:sBody calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #lean {animation:sLean calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #armL {animation:sArmL calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #armR {animation:sArmR calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #foreL{animation:sForeL calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #foreR{animation:sForeR calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #head {animation:sHead calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #antL {animation:sAntL calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #antR {animation:sAntR calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #legL {animation:sLegL calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #legR {animation:sLegR calc(2s*var(--t)) ease-out infinite}
[data-act="surprise"] #shadow{animation:sSh calc(2s*var(--t)) ease-out infinite}
@keyframes sBody{0%{transform:translateY(0) scale(1,1)}8%{transform:translateY(-30px) scale(.9,1.14)}
  18%{transform:translateY(-6px) scale(1.06,.95)}24%{transform:translateY(0) scale(1,1)}
  28%{transform:translateX(-5px)}32%{transform:translateX(5px)}36%{transform:translateX(-3px)}40%{transform:translateX(0)}
  70%,100%{transform:translateY(0) scale(1,1)}}

@keyframes sArmR{0%{transform:rotate(0)}8%{transform:rotate(-126deg)}30%{transform:rotate(-104deg)}55%{transform:rotate(-112deg)}85%,100%{transform:rotate(0)}}
@keyframes sForeL{0%{transform:rotate(0)}8%{transform:rotate(-40deg)}30%{transform:rotate(-20deg)}85%,100%{transform:rotate(0)}}
@keyframes sForeR{0%{transform:rotate(0)}8%{transform:rotate(40deg)}30%{transform:rotate(20deg)}85%,100%{transform:rotate(0)}}
@keyframes sHead{0%{transform:translateY(0) rotate(0)}8%{transform:translateY(-8px) rotate(0)}
  20%{transform:translateY(0) rotate(-4deg)}30%{transform:rotate(4deg)}40%,100%{transform:rotate(0)}}
@keyframes sAntL{0%{transform:rotate(0)}6%{transform:rotate(28deg)}12%{transform:rotate(-20deg)}18%{transform:rotate(16deg)}24%{transform:rotate(-10deg)}34%,100%{transform:rotate(0)}}
@keyframes sAntR{0%{transform:rotate(0)}6%{transform:rotate(-28deg)}12%{transform:rotate(20deg)}18%{transform:rotate(-16deg)}24%{transform:rotate(10deg)}34%,100%{transform:rotate(0)}}
@keyframes sLegL{0%{transform:rotate(0)}8%{transform:rotate(12deg) translateY(-6px)}26%,100%{transform:rotate(0)}}
@keyframes sLegR{0%{transform:rotate(0)}8%{transform:rotate(-12deg) translateY(-6px)}26%,100%{transform:rotate(0)}}
@keyframes sSh{0%{transform:scale(1);opacity:.2}10%{transform:scale(.7);opacity:.1}26%,100%{transform:scale(1);opacity:.2}}

/* ===== 9. バンザイ（喜ぶ） ===== */
[data-act="cheer"] #bob  {animation:cHop calc(.62s*var(--t)) cubic-bezier(.3,0,.5,1) infinite}
[data-act="cheer"] #armL {animation:cArmL calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #armR {animation:cArmR calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #foreL{animation:cForeL calc(.31s*var(--t)) ease-in-out infinite alternate}
[data-act="cheer"] #foreR{animation:cForeR calc(.31s*var(--t)) ease-in-out infinite alternate}
[data-act="cheer"] #legL {animation:cLegL calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #legR {animation:cLegR calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #shinL{animation:jumpKneeL calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #shinR{animation:jumpKneeR calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #head {animation:cHead calc(.62s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #antL {animation:antL calc(.4s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #antR {animation:antR calc(.44s*var(--t)) ease-in-out infinite}
[data-act="cheer"] #shadow{animation:cSh calc(.62s*var(--t)) ease-in-out infinite}

@keyframes cArmR{0%,100%{transform:rotate(-148deg)}50%{transform:rotate(-164deg)}}
@keyframes cForeL{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes cForeR{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}

[data-act="sleep"] #torso{animation:slBreathe calc(4.6s*var(--t)) ease-in-out infinite}
[data-act="sleep"] #head {animation:slHead calc(4.6s*var(--t)) ease-in-out infinite}
[data-act="sleep"] #antL {animation:slAntL calc(2.3s*var(--t)) ease-in-out forwards}
[data-act="sleep"] #antR {animation:slAntR calc(2.3s*var(--t)) ease-in-out forwards}
[data-act="sleep"] #armL {animation:slArmL calc(1.4s*var(--t)) ease-out forwards}
[data-act="sleep"] #armR {animation:slArmR calc(1.4s*var(--t)) ease-out forwards}

[data-act="sleep"] #foreR{animation:none}
[data-act="sleep"] #shadow{animation:shPulse calc(4.6s*var(--t)) ease-in-out infinite}

@keyframes slAntR{to{transform:rotate(34deg)}}
@keyframes slArmL{to{transform:rotate(7deg)}}
@keyframes slArmR{to{transform:rotate(-7deg)}}

/* ===== エフェクトのアニメーション ===== */
#fxZzz text{animation:zfloat calc(3s*var(--t)) ease-in-out infinite}
#fxZzz text:nth-child(2){animation-delay:calc(1s*var(--t))}
#fxZzz text:nth-child(3){animation-delay:calc(2s*var(--t))}
@keyframes zfloat{0%{transform:translate(0,14px) scale(.6);opacity:0}
  20%{opacity:.95}70%{opacity:.9}100%{transform:translate(26px,-46px) scale(1.25);opacity:0}}

#fxBubble{animation:pop calc(.45s*var(--t)) cubic-bezier(.34,1.56,.64,1) both;transform-box:view-box;transform-origin:292px 198px}
#fxBubble circle.dot{animation:dot calc(1.35s*var(--t)) ease-in-out infinite}
#fxBubble circle.dot:nth-of-type(2){animation-delay:calc(.2s*var(--t))}
#fxBubble circle.dot:nth-of-type(3){animation-delay:calc(.4s*var(--t))}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}

#fxExcl{animation:exclPop calc(2s*var(--t)) ease-out infinite;transform-box:view-box;transform-origin:180px 104px}
@keyframes exclPop{0%{transform:scale(0) rotate(-12deg);opacity:0}
  7%{transform:scale(1.5) rotate(4deg);opacity:1}14%{transform:scale(1) rotate(0);opacity:1}
  45%{transform:scale(1);opacity:1}60%{transform:scale(.8);opacity:0}100%{opacity:0}}

#fxSparkle g{animation:twinkle calc(1.5s*var(--t)) ease-in-out infinite;transform-box:view-box}
#fxSparkle g:nth-child(1){transform-origin:24px 150px;animation-delay:0s}
#fxSparkle g:nth-child(2){transform-origin:322px 84px;animation-delay:calc(.2s*var(--t))}
#fxSparkle g:nth-child(3){transform-origin:6px 330px;animation-delay:calc(.45s*var(--t))}
#fxSparkle g:nth-child(4){transform-origin:340px 298px;animation-delay:calc(.7s*var(--t))}
#fxSparkle g:nth-child(5){transform-origin:56px 34px;animation-delay:calc(.9s*var(--t))}
#fxSparkle g:nth-child(6){transform-origin:302px 442px;animation-delay:calc(1.1s*var(--t))}
#fxSparkle g:nth-child(7){transform-origin:28px 470px;animation-delay:calc(1.3s*var(--t))}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}

#fxNote text{animation:notefly calc(2.4s*var(--t)) linear infinite}
#fxNote text:nth-child(2){animation-delay:calc(.8s*var(--t))}
#fxNote text:nth-child(3){animation-delay:calc(1.6s*var(--t))}
@keyframes notefly{0%{transform:translate(0,0) rotate(-8deg);opacity:0}
  15%{opacity:1}100%{transform:translate(38px,-120px) rotate(18deg);opacity:0}}

/* 一時停止 */
.paused *,.paused{animation-play-state:paused !important}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

  <div class="opts">
    <label>速度 <input id="speed" type="range" min="1" max="10" step="1" value="5"><span id="spd">x1.0</span></label>
    <span class="sw" id="autoSw">&#9654; オート再生</span>
    <span class="sw" id="pauseSw">&#10074;&#10074; 一時停止</span>
  </div>
  <p class="note">
    キー操作: <b>1-9 / 0 / Z</b> でモーション切替、<b>Space</b> で一時停止。ロボットをクリックするとランダムに動きます。
    マウスを動かすと顔と首がカーソルを追いかけます。
  </p>
</div>

<script>
(function(){
  const ACTS = {
    idle:    {jp:'待機',     en:'IDLE',     face:'happy',    blink:true},
    wave:    {jp:'手をふる', en:'WAVE',     face:'happy',    blink:true},
    walk:    {jp:'歩く',     en:'WALK',     face:'happy',    blink:true},
    jump:    {jp:'ジャンプ', en:'JUMP',     face:'wide',     blink:false},
    dance:   {jp:'ダンス',   en:'DANCE',    face:'heart',    blink:false},
    robot:   {jp:'ロボ踊り', en:'ROBOT',    face:'wide',     blink:false},
    spin:    {jp:'回転',     en:'SPIN',     face:'wide',     blink:false},
    think:   {jp:'考える',   en:'THINKING', face:'think',    blink:true},
    surprise:{jp:'びっくり', en:'SURPRISE', face:'surprise', blink:false},
    cheer:   {jp:'バンザイ', en:'CHEER',    face:'heart',    blink:false},
    sleep:   {jp:'おやすみ', en:'SLEEP',    face:'sleepy',   blink:false}
  };
  const ORDER = Object.keys(ACTS);
  const stage = document.getElementById('stage');
  const tag   = document.getElementById('tag');
  const btns  = Array.from(document.querySelectorAll('.btn'));
  const headTilt = document.getElementById('headTilt');
  const face  = document.getElementById('face');
  const botwrap = document.getElementById('botwrap');
  let cur = 'idle', paused = false, autoTimer = null, touched = false;

  function setAct(name, fromUser){
    if(!ACTS[name]) return;
    if(fromUser) touched = true;
    cur = name;
    const a = ACTS[name];
    stage.removeAttribute('data-act');
    void stage.offsetWidth;                 /* リフローでアニメを頭出し */
    stage.setAttribute('data-act', name);
    stage.setAttribute('data-face', a.face);
    tag.innerHTML = a.jp + '<small>' + a.en + '</small>';
    btns.forEach(b => b.classList.toggle('on', b.dataset.act === name));
  }

  /* ボタン */
  btns.forEach(b => b.addEventListener('click', () => { stopAuto(); setAct(b.dataset.act, true); }));

  /* ロボットをクリック → ランダム */
  botwrap.addEventListener('click', () => {
    stopAuto();
    let n; do { n = ORDER[Math.floor(Math.random()*ORDER.length)]; } while(n === cur);
    setAct(n, true);
  });

  /* キーボード */
  const KEYS = {'1':'idle','2':'wave','3':'walk','4':'jump','5':'dance','6':'robot',
                '7':'spin','8':'think','9':'surprise','0':'cheer','z':'sleep','Z':'sleep'};
  document.addEventListener('keydown', e => {
    if(e.key === ' '){ e.preventDefault(); togglePause(); return; }
    const a = KEYS[e.key];
    if(a){ stopAuto(); setAct(a, true); }
  });

  /* まばたき */
  (function blinkLoop(){
    setTimeout(() => {
      if(ACTS[cur].blink && !paused){
        stage.setAttribute('data-face','blink');
        setTimeout(() => {
          if(stage.getAttribute('data-face') === 'blink')
            stage.setAttribute('data-face', ACTS[cur].face);
          if(Math.random() < .3){            /* たまに二度まばたき */
            setTimeout(() => {
              if(ACTS[cur].blink && !paused){
                stage.setAttribute('data-face','blink');
                setTimeout(() => {
                  if(stage.getAttribute('data-face') === 'blink')
                    stage.setAttribute('data-face', ACTS[cur].face);
                }, 120);
              }
            }, 180);
          }
        }, 130);
      }
      blinkLoop();
    }, 1600 + Math.random()*3400);
  })();

  /* カーソル追従（首と顔） */
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left)/r.width  - .5) * 2));
    const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top )/r.height - .5) * 2));
    headTilt.style.transform = 'rotate(' + (nx*4.5).toFixed(2) + 'deg)';
    face.style.transform = 'translate(' + (nx*9).toFixed(1) + 'px,' + (ny*6).toFixed(1) + 'px)';
  });
  stage.addEventListener('pointerleave', () => {
    headTilt.style.transform = 'rotate(0deg)';
    face.style.transform = 'translate(0px,0px)';
  });

  /* 速度 */
  const speed = document.getElementById('speed'), spd = document.getElementById('spd');
  function applySpeed(){
    const v = +speed.value;
    const t = (1.6 - v*0.12).toFixed(3);            /* 5 → 1.0 */
    document.documentElement.style.setProperty('--t', t);
    spd.textContent = 'x' + (1/t).toFixed(1);
  }
  speed.addEventListener('input', applySpeed); applySpeed();

  /* 一時停止 */
  const pauseSw = document.getElementById('pauseSw');
  function togglePause(){
    paused = !paused;
    stage.classList.toggle('paused', paused);
    pauseSw.classList.toggle('on', paused);
    pauseSw.innerHTML = paused ? '&#9654; 再生' : '&#10074;&#10074; 一時停止';
  }
  pauseSw.addEventListener('click', togglePause);

  /* オート再生 */
  const autoSw = document.getElementById('autoSw');
  function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer = null; autoSw.classList.remove('on'); } }
  autoSw.addEventListener('click', () => {
    if(autoTimer){ stopAuto(); return; }
    autoSw.classList.add('on');
    let i = ORDER.indexOf(cur);
    autoTimer = setInterval(() => { i = (i+1) % ORDER.length; setAct(ORDER[i]); }, 5200);
  });

  /* 起動時: ?act=wave のように指定できる。無指定ならあいさつ -> 待機 */
  const q = new URLSearchParams(location.search).get('act');
  if(q && ACTS[q]){
    setAct(q, true);
  } else {
    setAct('wave');
    setTimeout(() => { if(!touched && !autoTimer) setAct('idle'); }, 3000);
  }
})();
</script>
</body>
</html>
